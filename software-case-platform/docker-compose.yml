version: '3.8'

services:
  # Base de Datos Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: case-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: case_platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - case-network

  # Backend API Spring Boot 3 (Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: case-platform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: case_platform_db
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://frontend:80
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/data/storage
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - case-network

  # Frontend Web React 18 + Vite + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: case-platform-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - case-network

networks:
  case-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
