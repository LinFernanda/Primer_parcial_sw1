server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: case-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:case_platform_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: CasePlatformHikariCP
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  issuer: case-platform

logging:
  level:
    root: INFO
    com.caseplatform: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

ai:
  groq:
    api-key: ${GROQ_API_KEY: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}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  gemini:
    api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LqMQVzDjcxBX8C9h7nonPwd6ZKt9xRx4A6zkxcR3SxkQ}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
  openai:
    api-key: ${AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
  whisper:
    enabled: ${AI_WHISPER_ENABLED:true}


