server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework # Permite a Spring Boot reconocer HTTPS detrás de AWS ALB / CloudFront
  error:
    include-message: never # Seguridad: no exponer detalles internos en producción
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: case-platform-backend
  datasource:
    url: jdbc:postgresql://${AWS_RDS_ENDPOINT:localhost}:${DB_PORT:5432}/${DB_NAME:case_platform_db}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      pool-name: CasePlatformProdHikariCP
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
          batch_size: 25
        order_inserts: true
        order_updates: true

# Configuración de Monitoreo con Spring Actuator para AWS ALB / CloudWatch
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production

# Configuración de Almacenamiento Cloud AWS S3
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:case-platform-production-storage}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:} # Opcional: útil para LocalStack o endpoints privados VPC S3

# Restricción estricta de CORS para dominios autorizados de producción
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://caseplatform.com,https://app.caseplatform.com}

jwt:
  secret: ${JWT_SECRET:ProdSuperSecretKeyCasePlatform2026SecureHex64BytesLongRequiredBySecurityGuidelines}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
  issuer: case-platform-cloud

logging:
  level:
    root: INFO
    com.caseplatform: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","logger":"%logger{36}","message":"%msg"}%n'
